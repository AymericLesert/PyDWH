# Application log configuration

version: 1
verbose: True

# Logging configuration

formatters:
    standard:
        format: "%(asctime)s [%(levelname)-5s] %(message)s"

handlers:
    console:
        class: logging.StreamHandler
        level: DEBUG
        formatter: standard
        stream: ext://sys.stdout

root:
    level: NOTSET
    handlers: [console]
